name: Apply login and admin security patch

on:
  push:
    branches:
      - fix/production-readiness-v2
    paths:
      - scripts/patch-login-admin-security.mjs
      - .github/workflows/apply-login-admin-security.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/production-readiness-v2
          fetch-depth: 0

      - name: Apply source patch
        run: node scripts/patch-login-admin-security.mjs

      - name: Commit patched source
        run: |
          if git diff --quiet; then
            echo "No patch changes needed"
            exit 0
          fi
          git config user.name "meehoa-production-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/data-service.ts supabase/functions/admin-staff/index.ts app/page.tsx
          git commit -m "fix: login by employee code and protect privileged accounts"
          git push origin HEAD:fix/production-readiness-v2
