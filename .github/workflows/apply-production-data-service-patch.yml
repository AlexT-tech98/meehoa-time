name: Apply production data service patch

on:
  push:
    branches:
      - fix/production-readiness-v2
    paths:
      - scripts/patch-production-data-service.mjs
      - .github/workflows/apply-production-data-service-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/production-readiness-v2
          fetch-depth: 0

      - name: Apply source patch
        run: node scripts/patch-production-data-service.mjs

      - name: Commit patched source
        run: |
          if git diff --quiet; then
            echo "No patch changes needed"
            exit 0
          fi
          git config user.name "meehoa-production-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/data-service.ts
          git commit -m "fix: persist wage history and restore approved payable"
          git push origin HEAD:fix/production-readiness-v2
