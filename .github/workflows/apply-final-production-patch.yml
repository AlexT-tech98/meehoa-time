name: Apply final production safety patch

on:
  push:
    branches:
      - fix/production-readiness-v2
    paths:
      - scripts/final-production-patch.mjs
      - .github/workflows/apply-final-production-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/production-readiness-v2
          fetch-depth: 0

      - name: Apply source patch
        run: node scripts/final-production-patch.mjs

      - name: Commit patched source
        run: |
          if git diff --quiet; then
            echo "No patch changes needed"
            exit 0
          fi
          git config user.name "meehoa-production-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx supabase/migrations/202610020001_production_readiness.sql
          git commit -m "fix: hold incomplete attendance and add password reset"
          git push origin HEAD:fix/production-readiness-v2
