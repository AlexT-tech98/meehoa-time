name: Apply production UI fixes

on:
  push:
    branches:
      - fix/production-readiness-v2
    paths:
      - scripts/apply-production-ui-fixes.mjs
      - .github/workflows/apply-production-ui-fixes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/production-readiness-v2
          fetch-depth: 0

      - name: Apply deterministic source patch
        run: node scripts/apply-production-ui-fixes.mjs

      - name: Commit patched source
        run: |
          if git diff --quiet; then
            echo "No patch changes needed"
            exit 0
          fi
          git config user.name "meehoa-production-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "fix: connect production UI to secure attendance and payroll"
          git push origin HEAD:fix/production-readiness-v2
